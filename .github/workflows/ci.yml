name: TCRFlowX CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas==3.0.5 pytest==9.1.1

      - name: Run tests
        run: pytest -v tests/


  nextflow-config:
    name: Validate Nextflow profiles
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow 25.10.4
        env:
          NXF_VER: "25.10.4"
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Validate profiles
        run: |
          nextflow config -profile local >/dev/null
          nextflow config -profile docker >/dev/null
          nextflow config -profile slurm >/dev/null
          nextflow config -profile azure >/dev/null


  docker-build:
    name: Build dashboard container
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tcrflowx-dashboard:ci .


  end-to-end:
    name: End-to-end workflow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fastqc \
            r-base \
            unzip \
            wget

      - name: Install R packages
        run: |
          sudo Rscript -e 'install.packages(c("dplyr","tidyr","ggplot2"), repos="https://cloud.r-project.org")'

      - name: Install pipeline Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==3.0.5 \
            numpy==2.5.2 \
            scipy==1.18.1 \
            multiqc==1.35

      - name: Install Nextflow 25.10.4
        env:
          NXF_VER: "25.10.4"
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Install public MiXCR 4.7.0
        run: |
          wget -q \
            https://github.com/milaboratory/mixcr/releases/download/v4.7.0/mixcr-4.7.0.zip \
            -O /tmp/mixcr.zip

          unzip -q /tmp/mixcr.zip -d /tmp/mixcr

          sudo install -m 755 /tmp/mixcr/mixcr /usr/local/bin/mixcr

          sudo cp /tmp/mixcr/mixcr.jar /usr/local/bin/mixcr.jar

      - name: Verify MiXCR CI version
        env:
          MI_LICENSE: ${{ secrets.MI_LICENSE }}
        run: |
          mixcr --version
          mixcr --version | grep -F "MiXCR v4.7.0"

          mixcr listPresets \
            | grep -F "invivoscribe-human-dna-trb-lymphotrack"

      - name: Verify CI input checksums
        run: |
          cd tests/data/ci/fastq
          sha256sum -c ../fastq_checksums.sha256

      - name: Run complete workflow
        env:
          NXF_WORK: ${{ runner.temp }}/tcrflowx-work
          MI_LICENSE: ${{ secrets.MI_LICENSE }}
        run: |
          nextflow run main.nf \
            -profile local \
            --samplesheet tests/data/ci/samplesheet.csv \
            --reads_dir tests/data/ci/fastq \
            --outdir "${{ runner.temp }}/tcrflowx-results" \
            --input_integrity_manifest tests/data/ci/fastq_checksums.sha256

      - name: Validate workflow outputs
        run: |
          OUT="${{ runner.temp }}/tcrflowx-results"

          test -s "$OUT/qc/multiqc_raw/multiqc_report.html"
          test -s "$OUT/repertoire/tables/diversity_clonality.tsv"
          test -s "$OUT/repertoire/biological_summary.tsv"
          test -s "$OUT/repertoire/biological_interpretation.md"
          test -s "$OUT/mixcr/formal_qc_summary.tsv"
          test -s "$OUT/provenance/run_provenance.tsv"

          CLONES=$(find "$OUT/mixcr" \
            -type f \
            -name '*.clones_TRB.tsv' \
            | wc -l)

          test "$CLONES" -eq 5

          ROWS=$(tail -n +2 "$OUT/mixcr/formal_qc_summary.tsv" | wc -l)
          test "$ROWS" -eq 5

          grep -F "tests/data/ci/samplesheet.csv" \
            "$OUT/provenance/run_provenance.tsv"

          grep -F $'execution_profile\tlocal' \
            "$OUT/provenance/run_provenance.tsv"

      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcrflowx-e2e-evidence
          path: |
            ${{ runner.temp }}/tcrflowx-results/provenance
            ${{ runner.temp }}/tcrflowx-results/mixcr/formal_qc_summary.tsv
            ${{ runner.temp }}/tcrflowx-results/repertoire/biological_summary.tsv
            ${{ runner.temp }}/tcrflowx-results/qc/multiqc_raw/multiqc_report.html
